<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Created — Seam</title>
  <meta name="theme-color" content="#10151A" />
  <link rel="icon" type="image/png" href="./seam-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #D2113A;
      --red-bright: #F0284F;
      --bg: #10151A;
      --text: #F3F6F9;
      --text-muted: #9AA7B4;
      --font-display: 'Barlow Condensed', system-ui, sans-serif;
      --font-body: 'Barlow', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 55% at 50% 42%, rgba(210,17,58,0.18) 0%, transparent 68%),
        radial-gradient(ellipse 34% 42% at 15% 82%, rgba(210,17,58,0.12) 0%, transparent 62%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      animation: fadeUp 0.7s ease both;
    }
    .check-wrap { width: 92px; height: 92px; margin: 0 auto 32px; position: relative; }
    .check-ring {
      width: 92px; height: 92px; border-radius: 50%;
      border: 2px solid rgba(210,17,58,0.35);
      background: rgba(210,17,58,0.12);
      display: flex; align-items: center; justify-content: center;
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
    }
    .check-ring svg { width: 38px; height: 38px; }
    .check-ring svg polyline {
      stroke-dasharray: 60; stroke-dashoffset: 60;
      animation: drawCheck 0.4s ease 0.55s forwards;
    }
    .check-wrap::after {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      border: 1px solid rgba(210,17,58,0.25);
      animation: pulse 2.5s ease 1s infinite;
    }
    .eyebrow {
      font-family: var(--font-display);
      font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--red-bright);
      margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      animation: fadeUp 0.6s ease 0.35s both;
    }
    .eyebrow::before, .eyebrow::after {
      content: ''; width: 26px; height: 2px; background: var(--red); border-radius: 2px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 5rem); font-weight: 800;
      text-transform: uppercase; letter-spacing: -0.01em; line-height: 0.95;
      margin-bottom: 20px;
      animation: fadeUp 0.6s ease 0.45s both;
    }
    h1 span { color: var(--red); }
    p {
      font-size: 1.12rem; color: var(--text-muted); line-height: 1.7;
      max-width: 400px; margin: 0 auto;
      animation: fadeUp 0.6s ease 0.55s both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      70% { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="check-wrap">
      <div class="check-ring">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="7,19 15,27 29,10" stroke="#D2113A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
    <div class="eyebrow">Success</div>
    <h1>Account<br /><span>Created</span></h1>
    <p>You're all set. Open Seam and start charting pitches from the palm of your hand.</p>
  </div>
</body>
</html>
